services:
  - type: web
    name: daak-v2-api
    runtime: python
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 65
    healthCheckPath: /healthz/ready
    autoDeploy: true
    envVars:
      - key: API_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: AI_MODEL
        value: gpt-4.1-mini
      - key: AI_FALLBACK_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: API_CORS_ORIGINS
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
